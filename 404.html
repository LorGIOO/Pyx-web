<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada · Pyx</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/img/logo.svg" type="image/svg+xml">
  <script>try{var t=localStorage.getItem('pyx-tema');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <style>
    :root { color-scheme: light dark; --paper: #f4f2ec; --ink: #16171b; --ink-3: #7d8088; --blue: #007acc; --editor: #1d1e22; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper: #111214; --ink: #ebe8e1; --ink-3: #85837e; --blue: #3aa0ea; } }
    :root[data-theme="dark"] { --paper: #111214; --ink: #ebe8e1; --ink-3: #85837e; --blue: #3aa0ea; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink); font: 19px/1.55 Georgia, "Times New Roman", serif; padding: 24px 16px; box-sizing: border-box; }
    main { max-width: 34rem; }
    h1 { font-weight: 400; font-size: clamp(40px, 8vw, 72px); line-height: 1; letter-spacing: -.02em; margin: 0 0 18px; }
    pre { background: var(--editor); color: #d8d9dc; padding: 16px 18px; border-radius: 8px; font: 14px/1.7 ui-monospace, Consolas, monospace; overflow-x: auto; }
    .err { color: #ff8a80; } .c { color: #6f737b; font-style: italic; } .k { color: #f7a24b; }
    a { color: var(--blue); }
    p { color: var(--ink); }
  </style>
</head>
<body>
<main>
  <h1>Esta página no compila.</h1>
<pre><span class="k">\py</span>{pagina}
<span class="err">NameError: name 'pagina' is not defined</span>
<span class="c"># Como en Pyx: un \py{} que falla no escribe nada en el PDF.</span></pre>
  <p>La dirección no existe o ha cambiado de sitio. Vuelve a la <a href="/">portada</a>, al <a href="/manual/">manual</a> o a las <a href="/novedades/">novedades</a>.</p>
</main>
<script>
  // en un repositorio de proyecto (usuario.github.io/repositorio/) los enlaces llevan delante el nombre del repositorio
  (function () {
    var seg = location.pathname.split('/').filter(Boolean)[0];
    if (location.hostname.endsWith('github.io') && seg) {
      document.querySelectorAll('a[href^="/"]').forEach(function (a) { a.setAttribute('href', '/' + seg + a.getAttribute('href')); });
    }
  })();
</script>
</body>
</html>
