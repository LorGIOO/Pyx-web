# Publica la web: cada cambio en main se copia a la rama gh-pages,
# que es la que sirve GitHub Pages (https://lorgioo.github.io/Pyx-web/).
name: Publicar la web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Copiar main a gh-pages
        run: git push --force origin HEAD:refs/heads/gh-pages
